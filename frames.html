<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ricole Project — Рамки</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
/* ── Reset & Root ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #090909;
  --panel:   #111111;
  --surface: #161616;
  --border:  #222222;
  --accent:  #e8ff00;
  --danger:  #ff2d55;
  --text:    #efefef;
  --muted:   #484848;
  --mono:    'Space Mono', monospace;
  --display: 'Bebas Neue', cursive;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  overflow: hidden;
}

/* ── Header ───────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex-shrink: 0;
}
header h1 {
  font-family: var(--display);
  font-size: 24px;
  letter-spacing: 5px;
  color: var(--accent);
}
header nav { display: flex; gap: 2px; }
header nav a {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  padding: 6px 12px;
  border: 1px solid transparent;
  transition: color .15s, border-color .15s;
}
header nav a:hover { color: var(--text); border-color: var(--border); }
header nav a.active { color: var(--accent); border-color: var(--accent); }
header .header-right {
  margin-left: auto;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
}

/* ── Layout ───────────────────────────────────── */
.workspace {
  display: flex;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Left Panel ───────────────────────────────── */
.panel {
  width: 220px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-label {
  padding: 12px 16px 8px;
  font-size: 8px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel-scroll::-webkit-scrollbar { width: 3px; }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Section ──────────────────────────────────── */
.section { display: flex; flex-direction: column; gap: 6px; }
.section > label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── Style grid ───────────────────────────────── */
.style-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
}
.sb {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 4px;
  font-size: 9px;
  cursor: pointer;
  text-align: center;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  line-height: 1.3;
  transition: border-color .12s, color .12s, background .12s;
}
.sb:hover, .ab:hover { border-color: var(--muted); color: var(--text); }
.sb.on, .ab.on {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(232,255,0,.05);
}
.ab {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 4px;
  font-size: 9px;
  cursor: pointer;
  text-align: center;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  line-height: 1.3;
  transition: border-color .12s, color .12s, background .12s;
}

/* ── Resolution grid ─────────────────────────── */
.res-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
}
.rb {
  padding: 5px 3px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: transparent;
  font-size: 9px;
  cursor: pointer;
  color: var(--muted);
  font-family: var(--mono);
  text-align: center;
  transition: border-color .12s, color .12s, background .12s;
}
.rb:hover { border-color: var(--muted); color: var(--text); }
.rb.on {
  background: var(--surface);
  color: var(--text);
  border-color: var(--muted);
  font-weight: 700;
}

/* ── Color palette ───────────────────────────── */
.palette {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 6px;
}
.pc {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  flex-shrink: 0;
  transition: border-color .12s, transform .12s;
}
.pc:hover { transform: scale(1.15); }
.pc.on { border-color: var(--text); }

.color-custom label {
  display: block;
  font-size: 9px;
  color: var(--muted);
  margin-bottom: 4px;
  letter-spacing: 1px;
}
.color-custom input[type=color] {
  width: 100%;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0;
  background: none;
  cursor: pointer;
}
.color-custom input[type=color]:hover { border-color: var(--muted); }

/* ── Range row ───────────────────────────────── */
.range-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.range-row label {
  font-size: 9px;
  color: var(--muted);
  flex: 1;
  letter-spacing: 0;
}
.range-row span {
  font-size: 10px;
  font-weight: 700;
  color: var(--text);
  min-width: 22px;
  text-align: right;
}
input[type=range] {
  width: 100%;
  -webkit-appearance: none;
  height: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
  border-radius: 1px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

/* ── Buttons ─────────────────────────────────── */
.btn {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 9px 14px;
  cursor: pointer;
  border: 1px solid;
  transition: background .12s, color .12s;
  width: 100%;
}
.btn-ghost {
  background: transparent;
  color: var(--muted);
  border-color: var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--muted); }
.btn-dl {
  background: rgba(0, 180, 255, .08);
  color: #7ec8f0;
  border-color: rgba(0, 180, 255, .3);
  font-weight: 700;
}
.btn-dl:hover { background: rgba(0, 180, 255, .18); border-color: #7ec8f0; }

/* ── Canvas area ─────────────────────────────── */
.canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  padding: 24px;
  overflow: hidden;
  position: relative;
}

/* Checkerboard bg to show transparency */
.canvas-wrap {
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--border);
  background:
    repeating-conic-gradient(#1a1a1a 0% 25%, #111 0% 50%)
    0 0 / 20px 20px;
}
canvas {
  display: block;
}

/* ── Info bar (bottom of canvas) ─────────────── */
.info-bar {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 14px;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--muted);
  pointer-events: none;
}
.info-bar span { color: var(--accent); font-weight: 700; }

/* ── Divider ─────────────────────────────────── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 2px 0;
}
</style>
</head>

<div class="workspace">

<script>
/* ═══════════════════════════════════════════════
   Frame Generator — adapted from frame_ultra_pro.html
   Встроен в CHROMATYPE как отдельная страница
═══════════════════════════════════════════════ */
const τ = Math.PI * 2;
let W = 1920, H = 1080, sty = 'baroque';

const COLS = [
  '#d4a84b','#e8e8e8','#aed6f1','#a29bfe',
  '#fd79a8','#55efc4','#e17055','#ffffff',
  '#c0392b','#2c3e50'
];

// ── Palette init ──────────────────────────────
const palEl = document.getElementById('pal');
COLS.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'pc' + (i === 0 ? ' on' : '');
  d.style.background = c;
  d.onclick = () => {
    document.getElementById('fc').value = c;
    palEl.querySelectorAll('.pc').forEach(p => p.classList.remove('on'));
    d.classList.add('on');
    draw();
  };
  palEl.appendChild(d);
});

function clrP() { palEl.querySelectorAll('.pc').forEach(p => p.classList.remove('on')); }

function setR(w, h, b) {
  W = w; H = h;
  document.querySelectorAll('.rb').forEach(r => r.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('infoRes').textContent = `${w} × ${h}`;
  draw();
}

function setS(b) {
  sty = b.dataset.s;
  document.querySelectorAll('.sb').forEach(s => s.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('infoStyle').textContent = sty.toUpperCase();
  draw();
}

function P() {
  return {
    fc:  document.getElementById('fc').value,
    th:  +document.getElementById('thk').value,
    det: +document.getElementById('det').value,
    pad: +document.getElementById('pad').value / 100,
  };
}

function makeCtx(w, h, el) {
  const area   = document.getElementById('canvasArea');
  const maxW   = area.clientWidth  - 80;
  const maxH   = area.clientHeight - 60;
  const sc     = Math.min(maxW / w, maxH / h, 1);
  el.width     = Math.round(w * sc);
  el.height    = Math.round(h * sc);
  const ctx    = el.getContext('2d');
  ctx.clearRect(0, 0, el.width, el.height);
  ctx.scale(sc, sc);
  return ctx;
}

// ── Animation state ─────────────────────────────
let animMode = 'none';
let animAmt = 0.5;
let animSpeed = 1.0;
let animRAF = null;
let animT0 = 0;

function fakeBands(t) {
  const beatT = (t * 100 / 60) % 1;          // simulate ~100 BPM
  return {
    bass: Math.pow(1 - beatT, 3) * 0.85,
    mid:  (Math.sin(t * 3.2) * 0.5 + 0.5) * 0.55,
    high: (Math.sin(t * 11)  * 0.5 + 0.5) * 0.4,
  };
}

function draw() { drawFrame(0); }

function drawFrame(t) {
  const p   = P();
  const ctx = makeCtx(W, H, document.getElementById('c'));
  render(ctx, W, H, p, t);
}

function tick() {
  if (animMode === 'none') { animRAF = null; return; }
  const t = (performance.now() - animT0) / 1000;
  drawFrame(t);
  animRAF = requestAnimationFrame(tick);
}

function setAnimMode(mode) {
  animMode = mode;
  document.querySelectorAll('.ab').forEach(b => b.classList.toggle('on', b.dataset.a === mode));
  const params = document.getElementById('animParams');
  if (params) params.style.display = (mode === 'none') ? 'none' : '';
  if (mode === 'none') {
    if (animRAF) cancelAnimationFrame(animRAF);
    animRAF = null;
    draw();
  } else if (!animRAF) {
    animT0 = performance.now();
    tick();
  }
}

function dl() {
  const p = P();
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  // Export всегда статический (t=0), без анимации
  const savedMode = animMode; animMode = 'none';
  render(ctx, W, H, p, 0);
  animMode = savedMode;
  const a = document.createElement('a');
  a.download = `frame_${sty}_${W}x${H}.png`;
  a.href = c.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function render(ctx, W, H, p, t) {
  const { th: thRaw, det, pad } = p;
  let fc = p.fc;
  // Resolution-aware толщина: th=3 в слайдере → ~3px при 1080p, ~6px при 4K, ~2px при 720p
  let th  = thRaw * (Math.min(W, H) / 1080);
  const mg = Math.min(W, H) * pad;

  // ── Анимационные трансформации (синхронно с FrameDrawEngine из основного движка) ──
  let scaleF = 1, extraAlpha = 1, extraRot = 0, extraTransX = 0, extraTransY = 0;
  let colorOverride = null;
  if (animMode !== 'none' && t > 0) {
    const bands = fakeBands(t);
    const aspd = animSpeed, aamt = animAmt;
    if (animMode === 'pulse') {
      th *= 1 + bands.bass * aamt * 1.8;
    } else if (animMode === 'breathe') {
      scaleF = 1 + Math.sin(t * 1.2 * aspd) * aamt * 0.04 + bands.bass * aamt * 0.03;
    } else if (animMode === 'glitch') {
      if (bands.bass > 0.35) {
        extraTransX = (Math.random() - 0.5) * bands.bass * aamt * 30;
        extraTransY = (Math.random() - 0.5) * bands.bass * aamt * 15;
      }
    } else if (animMode === 'rainbow') {
      const hue = ((t * 60 * aspd) % 360);
      colorOverride = `hsl(${hue}, 90%, 60%)`;
    } else if (animMode === 'sparkle') {
      extraAlpha = 0.5 + bands.bass * 0.5;
    } else if (animMode === 'swing') {
      extraRot = Math.sin(t * 1.2 * aspd) * aamt * 0.12;
      scaleF   = 1 + Math.sin(t * 1.2 * aspd) * aamt * 0.02;
    } else if (animMode === 'rotate') {
      extraRot = t * aspd * (0.4 + aamt * 1.0);
    } else if (animMode === 'flicker') {
      const r  = Math.sin(t * 13.7 * aspd) * Math.cos(t * 7.3 * aspd);
      const fk = Math.abs(r);
      if (fk < 0.15 * aamt) extraAlpha = 0.15;
      else if (fk < 0.35 * aamt) extraAlpha = 0.55;
      else extraAlpha = 0.85 + bands.bass * 0.15;
    } else if (animMode === 'chromatic') {
      extraTransX = Math.sin(t * 11 * aspd) * bands.bass * aamt * 14;
      extraAlpha = 0.85 + bands.bass * 0.15;
    } else if (animMode === 'march') {
      ctx.setLineDash([Math.max(2, th * 2.2), Math.max(2, th * 1.3)]);
      ctx.lineDashOffset = -t * (5 + aamt * 30) * aspd;
    }
  }
  if (colorOverride) fc = colorOverride;

  ctx.save();
  if (scaleF !== 1 || Math.abs(extraRot) > 0.0005 || extraTransX || extraTransY) {
    ctx.translate(W / 2 + extraTransX, H / 2 + extraTransY);
    if (Math.abs(extraRot) > 0.0005) ctx.rotate(extraRot);
    if (scaleF !== 1) ctx.scale(scaleF, scaleF);
    ctx.translate(-W / 2, -H / 2);
  }
  if (extraAlpha < 1) ctx.globalAlpha = extraAlpha;

  ctx.strokeStyle = fc;
  ctx.fillStyle   = fc;
  ctx.lineWidth   = th;
  DRAW[sty](ctx, mg, mg, W - mg * 2, H - mg * 2, fc, th, det, W, H, t || 0);

  if (animMode === 'march') ctx.setLineDash([]);
  ctx.restore();
}

// ─── helpers ──────────────────────────────────
function line(ctx,x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function circle(ctx,x,y,r,fill=false){ctx.beginPath();ctx.arc(x,y,r,0,τ);fill?ctx.fill():ctx.stroke();}
function dot(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,τ);ctx.fill();}
function rect(ctx,x,y,w,h){ctx.strokeRect(x,y,w,h);}
function oct(ctx,x,y,w,h,c){ctx.beginPath();ctx.moveTo(x+c,y);ctx.lineTo(x+w-c,y);ctx.lineTo(x+w,y+c);ctx.lineTo(x+w,y+h-c);ctx.lineTo(x+w-c,y+h);ctx.lineTo(x+c,y+h);ctx.lineTo(x,y+h-c);ctx.lineTo(x,y+c);ctx.closePath();ctx.stroke();}
function polygon(ctx,cx,cy,r,n,a0=0){ctx.beginPath();for(let i=0;i<n;i++){const a=a0+i*τ/n;i?ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();ctx.stroke();}
function star(ctx,cx,cy,r1,r2,n,a0=0){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=a0+i*Math.PI/n;i?ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();ctx.stroke();}
function dline(ctx,x1,y1,x2,y2,dash){ctx.save();ctx.setLineDash(dash);line(ctx,x1,y1,x2,y2);ctx.setLineDash([]);ctx.restore();}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();ctx.stroke();}
function withLW(ctx,lw,fn){const old=ctx.lineWidth;ctx.lineWidth=lw;fn();ctx.lineWidth=old;}
function corners4(fn){[[1,1],[-1,1],[-1,-1],[1,-1]].forEach(([sx,sy])=>fn(sx,sy));}

// ─── sub-draw helpers ──────────────────────────
function circComp(ctx,x,y,sz,th,type){
  ctx.save();ctx.translate(x+sz/2,y);

  if(type==='resistor'){withLW(ctx,th*.8,()=>ctx.strokeRect(-sz*.28,-h2,sz*.56,h2*2));}
  else if(type==='cap'){withLW(ctx,th*.8,()=>{line(ctx,-sz*.35,-h2,sz*.35,-h2);line(ctx,-sz*.35,h2,sz*.35,h2);});}
  else if(type==='coil'){withLW(ctx,th*.7,()=>{for(let i=0;i<4;i++)ctx.beginPath()||(ctx.arc(-sz*.25+i*sz*.16,0,sz*.12,-Math.PI,0))||ctx.stroke();});}

  else{withLW(ctx,th*.6,()=>{ctx.beginPath();ctx.moveTo(-sz*.3,h2);ctx.lineTo(0,-h2);ctx.lineTo(sz*.3,h2);ctx.stroke();});}
  ctx.restore();
}
function celticKnot(ctx,x,y,w,h,vert){
  ctx.save();ctx.translate(x,y);
  if(!vert){
    ctx.beginPath();ctx.moveTo(0,h*.5);ctx.bezierCurveTo(w*.12,-h*.3,w*.38,h*1.3,w*.5,h*.5);ctx.bezierCurveTo(w*.62,-h*.3,w*.88,h*1.3,w,h*.5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,h*.5);ctx.bezierCurveTo(w*.12,h*1.3,w*.38,-h*.3,w*.5,h*.5);ctx.bezierCurveTo(w*.62,h*1.3,w*.88,-h*.3,w,h*.5);ctx.stroke();
  } else {
    ctx.beginPath();ctx.moveTo(w*.5,0);ctx.bezierCurveTo(-w*.3,h*.12,w*1.3,h*.38,w*.5,h*.5);ctx.bezierCurveTo(-w*.3,h*.62,w*1.3,h*.88,w*.5,h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(w*.5,0);ctx.bezierCurveTo(w*1.3,h*.12,-w*.3,h*.38,w*.5,h*.5);ctx.bezierCurveTo(w*1.3,h*.62,-w*.3,h*.88,w*.5,h);ctx.stroke();
  }
  ctx.restore();
}
function gothicArch(ctx,x,y,w,h,th){
  ctx.save();ctx.translate(x+w/2,y);const hw=w*.44;
  ctx.beginPath();ctx.moveTo(-hw,h);ctx.bezierCurveTo(-hw,h*.25,0,-h*.08,0,-h*.08);ctx.bezierCurveTo(0,-h*.08,hw,h*.25,hw,h);ctx.stroke();
  withLW(ctx,ctx.lineWidth*.6,()=>{ctx.beginPath();ctx.arc(-hw*.38,h*.48,hw*.34,-Math.PI,0);ctx.stroke();ctx.beginPath();ctx.arc(hw*.38,h*.48,hw*.34,-Math.PI,0);ctx.stroke();polygon(ctx,0,-h*.05,hw*.18,6);});
  ctx.restore();
}
function neoArch(ctx,x,y,w,h,th){
  ctx.save();ctx.translate(x+w/2,y);const hw=w*.44;
  ctx.beginPath();ctx.moveTo(-hw,h);ctx.bezierCurveTo(-hw,h*.2,-hw*.5,-h*.05,0,-h*.08);ctx.bezierCurveTo(hw*.5,-h*.05,hw,h*.2,hw,h);ctx.stroke();
  withLW(ctx,ctx.lineWidth*.55,()=>{
    ctx.beginPath();ctx.arc(-hw*.35,h*.42,hw*.3,-Math.PI,0);ctx.stroke();
    ctx.beginPath();ctx.arc(hw*.35,h*.42,hw*.3,-Math.PI,0);ctx.stroke();
    ctx.beginPath();ctx.arc(-hw*.35,h*.42,hw*.15,-Math.PI,0);ctx.stroke();
    ctx.beginPath();ctx.arc(hw*.35,h*.42,hw*.15,-Math.PI,0);ctx.stroke();
    star(ctx,0,-h*.04,hw*.2,hw*.1,8,-Math.PI/8);
  });ctx.restore();
}
function meander(ctx,x,y,w,h,th){
  ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w*.2,0);ctx.lineTo(w*.2,h);ctx.lineTo(w*.5,h);ctx.lineTo(w*.5,h*.5);ctx.lineTo(w*.8,h*.5);ctx.lineTo(w*.8,0);ctx.lineTo(w,0);ctx.stroke();
  ctx.restore();
}
function rune(ctx,x,y,sz,type){
  ctx.save();ctx.translate(x,y);
  const s=[
    ()=>{line(ctx,0,-sz,0,sz);line(ctx,0,-sz*.2,sz*.6,sz*.2);line(ctx,0,sz*.2,sz*.6,-sz*.2);},
    ()=>{line(ctx,-sz*.4,-sz,-sz*.4,sz);line(ctx,-sz*.4,-sz*.5,sz*.4,0);line(ctx,-sz*.4,sz*.5,sz*.4,0);},
    ()=>{line(ctx,-sz*.3,-sz,0,0);line(ctx,sz*.3,-sz,0,0);line(ctx,0,0,0,sz);},
    ()=>{line(ctx,0,-sz,0,sz);line(ctx,-sz*.5,-sz*.3,sz*.5,sz*.3);},
    ()=>{line(ctx,0,-sz,0,sz);line(ctx,-sz*.5,0,sz*.5,-sz*.5);line(ctx,-sz*.5,0,sz*.5,sz*.5);},
    ()=>{line(ctx,-sz*.4,-sz,sz*.4,0);line(ctx,-sz*.4,sz,sz*.4,0);},
    ()=>{ctx.beginPath();ctx.moveTo(0,-sz);ctx.lineTo(sz*.5,0);ctx.lineTo(0,sz);ctx.lineTo(-sz*.5,0);ctx.closePath();ctx.stroke();},
    ()=>{line(ctx,-sz*.5,-sz*.5,sz*.5,-sz*.5);line(ctx,0,-sz*.5,0,sz);line(ctx,-sz*.5,sz*.4,sz*.5,sz*.4);}
  ];
  s[type%8]();ctx.restore();
}
function tribalUnit(ctx,x,y,w,h,vert){
  ctx.save();ctx.translate(x,y);
  if(!vert){
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w*.5,-h*.6);ctx.lineTo(w,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(w*.15,0);ctx.lineTo(w*.5,-h*.3);ctx.lineTo(w*.85,0);ctx.stroke();
    dot(ctx,w*.5,-h*.6,ctx.lineWidth*.8);
  } else {
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w*.6,h*.5);ctx.lineTo(0,h);ctx.stroke();

}
function pipeJoint(ctx,r,th){
  circle(ctx,0,0,r);circle(ctx,0,0,r*.55);

}
function laceCell(ctx,x,y,w,h,th){
  ctx.save();ctx.translate(x+w/2,y+h/2);const r=Math.min(w,h)*.42;

  for(let i=0;i<8;i++){const a=i*τ/8+Math.PI/8;dot(ctx,Math.cos(a)*r*.85,Math.sin(a)*r*.85,th*.5);}

}
function aztecGlyph(ctx,x,y,r,th,type){
  ctx.save();ctx.translate(x,y);
  const s=[
    ()=>{ctx.strokeRect(-r,-r,r*2,r*2);ctx.strokeRect(-r*.5,-r*.5,r,r);},
    ()=>{polygon(ctx,0,0,r,4,Math.PI/4);polygon(ctx,0,0,r*.55,4,Math.PI/4);},
    ()=>{line(ctx,-r,0,r,0);line(ctx,0,-r,0,r);line(ctx,-r,-r,r,r);},
    ()=>{for(let i=0;i<4;i++){const a=i*Math.PI/2;line(ctx,Math.cos(a)*r*.3,Math.sin(a)*r*.3,Math.cos(a)*r,Math.sin(a)*r);}circle(ctx,0,0,r*.3);},
    ()=>{polygon(ctx,0,0,r,3,-Math.PI/2);polygon(ctx,0,0,r*.55,3,Math.PI/6);},
    ()=>{star(ctx,0,0,r,r*.5,4);}
  ];
  s[type%6]();ctx.restore();
}
function arabesqueCell(ctx,x,y,sz,th){
  ctx.save();ctx.translate(x+sz/2,y+sz/2);const r=sz*.42;
  for(let i=0;i<4;i++){ctx.save();ctx.rotate(i*Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(r*.5,0,r,r*.3,r*.7,r*.7);ctx.bezierCurveTo(r*.3,r,0,r*.5,0,0);ctx.stroke();ctx.restore();}
  circle(ctx,0,0,r*.3);ctx.restore();
}

// ─── DRAW styles ──────────────────────────────
const DRAW = {
baroque(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*2.5,()=>rect(ctx,x,y,w,h));
  withLW(ctx,th*0.8,()=>rect(ctx,x+th*6,y+th*6,w-th*12,h-th*12));
  withLW(ctx,th*0.35,()=>rect(ctx,x+th*10,y+th*10,w-th*20,h-th*20));
  const cs=Math.min(w,h)*0.1;
  [[x,y,1,1],[x+w,y,-1,1],[x+w,y+h,-1,-1],[x,y+h,1,-1]].forEach(([cx,cy,sx,sy])=>{
    ctx.save();ctx.translate(cx,cy);ctx.scale(sx,sy);
    withLW(ctx,th,()=>{
      ctx.beginPath();ctx.arc(cs*.5,0,cs*.5,Math.PI,0);ctx.stroke();
      ctx.beginPath();ctx.arc(0,cs*.5,cs*.5,-Math.PI/2,Math.PI/2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(cs*.8,cs*.2,cs*.2,cs*.8,0,cs*1.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cs,0);ctx.bezierCurveTo(cs*1.3,cs*.4,cs*.6,cs*.8,cs*.8,cs*1.2);ctx.stroke();
    });
    dot(ctx,cs*.9,cs*.1,th*1.2);dot(ctx,cs*.1,cs*.9,th*1.2);dot(ctx,cs*.6,cs*.6,th*.8);
    ctx.restore();
  });
  const n=det+3;
  for(let i=1;i<n;i++){
    const t=i/n;
    [[x+w*t,y],[x+w*t,y+h],[x,y+h*t],[x+w,y+h*t]].forEach(([px,py],k)=>{
      ctx.save();ctx.translate(px,py);if(k>1)ctx.rotate(Math.PI/2);
      withLW(ctx,th*.9,()=>{
        ctx.beginPath();ctx.moveTo(-th*5,0);ctx.bezierCurveTo(-th*2,-th*4,th*2,-th*4,th*5,0);ctx.stroke();
        ctx.beginPath();ctx.moveTo(-th*5,0);ctx.bezierCurveTo(-th*2,th*4,th*2,th*4,th*5,0);ctx.stroke();
        dot(ctx,0,0,th*.9);dot(ctx,-th*4.5,0,th*.5);dot(ctx,th*4.5,0,th*.5);
      });ctx.restore();
    });
  }
},
cypher(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*2,()=>rect(ctx,x,y,w,h));
  withLW(ctx,th*.6,()=>rect(ctx,x+th*8,y+th*8,w-th*16,h-th*16));
  withLW(ctx,th*.3,()=>rect(ctx,x+th*12,y+th*12,w-th*24,h-th*24));
  const r=Math.min(w,h)*.09;
  [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach(([cx,cy])=>{
    ctx.save();ctx.translate(cx,cy);
    withLW(ctx,th*1.2,()=>circle(ctx,0,0,r));
    withLW(ctx,th*.6,()=>{circle(ctx,0,0,r*.65);circle(ctx,0,0,r*.3);});
    for(let i=0;i<16;i++){const a=i*τ/16;withLW(ctx,th*.5,()=>line(ctx,Math.cos(a)*r*.67,Math.sin(a)*r*.67,Math.cos(a)*r*.97,Math.sin(a)*r*.97));}
    dot(ctx,0,0,th*.9);
    ctx.restore();
  });
  const n=det+4;
  for(let i=0;i<n;i++){
    const t=(i+.5)/n;
    [[x+w*t,y,0],[x+w*t,y+h,0],[x,y+h*t,1],[x+w,y+h*t,1]].forEach(([px,py,rot])=>{
      ctx.save();ctx.translate(px,py);if(rot)ctx.rotate(Math.PI/2);
      withLW(ctx,th*.8,()=>{
        ctx.beginPath();ctx.moveTo(-th*4,0);ctx.bezierCurveTo(-th*1.5,-th*3.5,th*1.5,-th*3.5,th*4,0);ctx.stroke();
        ctx.beginPath();ctx.moveTo(-th*4,0);ctx.bezierCurveTo(-th*1.5,th*3.5,th*1.5,th*3.5,th*4,0);ctx.stroke();
        ctx.beginPath();ctx.arc(-th*2.5,-th*1.5,th*.6,0,τ);ctx.stroke();
        ctx.beginPath();ctx.arc(th*2.5,-th*1.5,th*.6,0,τ);ctx.stroke();
        dot(ctx,0,0,th*.7);
      });ctx.restore();
    });
  }
},
futurism(ctx,x,y,w,h,fc,th,det){
  const c=Math.min(w,h)*.05;
  withLW(ctx,th*3,()=>oct(ctx,x,y,w,h,c));
  withLW(ctx,th*.8,()=>oct(ctx,x+c*2,y+c*2,w-c*4,h-c*4,c*.7));
  withLW(ctx,th*.3,()=>oct(ctx,x+c*3.5,y+c*3.5,w-c*7,h-c*7,c*.4));
  withLW(ctx,th*2,()=>{
    line(ctx,x+c*4,y,x+w*.32,y);line(ctx,x+w*.68,y,x+w-c*4,y);
    line(ctx,x+c*4,y+h,x+w*.32,y+h);line(ctx,x+w*.68,y+h,x+w-c*4,y+h);
    line(ctx,x,y+c*4,x,y+h*.32);line(ctx,x,y+h*.68,x,y+h-c*4);
    line(ctx,x+w,y+c*4,x+w,y+h*.32);line(ctx,x+w,y+h*.68,x+w,y+h-c*4);
  });
  const n=det*3+6;
  for(let i=0;i<n;i++){
    const t=(i+.5)/n;const f=i%3===0?th*4:i%3===1?th*2.5:th*1.5;
    withLW(ctx,th*.7,()=>{line(ctx,x+w*t,y,x+w*t,y-f);line(ctx,x+w*t,y+h,x+w*t,y+h+f);});
    if(i%5===0)withLW(ctx,th*.4,()=>{line(ctx,x+w*t-th,y-f,x+w*t+th,y-f);line(ctx,x+w*t-th,y+h+f,x+w*t+th,y+h+f);});
    withLW(ctx,th*.7,()=>{line(ctx,x,y+h*t,x-f,y+h*t);line(ctx,x+w,y+h*t,x+w+f,y+h*t);});

  [[x,y,1,1],[x+w,y,-1,1],[x+w,y+h,-1,-1],[x,y+h,1,-1]].forEach(([cx,cy,sx,sy])=>{
    ctx.save();ctx.translate(cx,cy);ctx.scale(sx,sy);

circuit(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*2,()=>rect(ctx,x,y,w,h));

    ctx.save();ctx.translate(cx,cy);
    withLW(ctx,th,()=>{circle(ctx,0,0,step*.9);circle(ctx,0,0,step*.55);});
    withLW(ctx,th*.5,()=>{for(let i=0;i<8;i++){const a=i*τ/8;line(ctx,Math.cos(a)*step*.57,Math.sin(a)*step*.57,Math.cos(a)*step*.88,Math.sin(a)*step*.88);}});

  });
},
celtic(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*2.5,()=>rect(ctx,x,y,w,h));

    ctx.save();ctx.translate(cx,cy);
    withLW(ctx,th*1.3,()=>{circle(ctx,0,0,th*7);circle(ctx,0,0,th*4.5);});
    withLW(ctx,th*.7,()=>{for(let i=0;i<12;i++){const a=i*τ/12;line(ctx,Math.cos(a)*th*4.7,Math.sin(a)*th*4.7,Math.cos(a)*th*6.8,Math.sin(a)*th*6.8);}});

  });
},
artdeco(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*3,()=>rect(ctx,x,y,w,h));
  withLW(ctx,th,()=>rect(ctx,x+th*5,y+th*5,w-th*10,h-th*10));
  withLW(ctx,th*.4,()=>rect(ctx,x+th*9,y+th*9,w-th*18,h-th*18));
  withLW(ctx,th*.2,()=>rect(ctx,x+th*11,y+th*11,w-th*22,h-th*22));
  const fanR=Math.min(w,h)*.12;
  [[x,y,0],[x+w,y,1],[x+w,y+h,2],[x,y+h,3]].forEach(([cx,cy,rot])=>{
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rot*Math.PI/2+Math.PI/4);
    const n2=det+4;
    withLW(ctx,th*.7,()=>{
      for(let i=0;i<=n2;i++){const a=-Math.PI/4+i*Math.PI*.5/n2;line(ctx,0,0,Math.cos(a)*fanR,Math.sin(a)*fanR);}
      for(let ri=fanR*.2;ri<=fanR;ri+=fanR*.15)ctx.beginPath()||(ctx.arc(0,0,ri,-Math.PI/4,Math.PI/4))||ctx.stroke();
    });
    withLW(ctx,th*.4,()=>{star(ctx,0,0,fanR*.2,fanR*.1,8);});
    ctx.restore();
  });
  const n=det*2+4;
  for(let i=1;i<n;i++){
    const t=i/n;
    [[x+w*t,y],[x+w*t,y+h],[x,y+h*t],[x+w,y+h*t]].forEach(([px,py],k)=>{
      ctx.save();ctx.translate(px,py);if(k>1)ctx.rotate(Math.PI/2);
      const sz=i%3===0?th*4:th*2.5;
      withLW(ctx,th*.8,()=>{line(ctx,0,0,0,sz);line(ctx,-sz*.4,sz,sz*.4,sz);if(i%3===0)line(ctx,-sz*.2,0,sz*.2,0);});
      ctx.restore();
    });
  }
},
mandala(ctx,x,y,w,h,fc,th,det){
  const cx=x+w/2,cy=y+h/2,R=Math.min(w,h)/2*.97;
  withLW(ctx,th*2.5,()=>circle(ctx,cx,cy,R));
  const rings=det+4;
  for(let i=1;i<=rings;i++){withLW(ctx,i===1?th*1.5:th*.5,()=>circle(ctx,cx,cy,R*(1-i/(rings+1)*.8)));}
  const n1=det*4+12;
  withLW(ctx,th*.9,()=>{
    for(let i=0;i<n1;i++){
      ctx.save();ctx.translate(cx,cy);ctx.rotate(i*τ/n1);
      ctx.beginPath();ctx.moveTo(0,R*.27);ctx.bezierCurveTo(R*.12,R*.55,-R*.12,R*.55,0,R*.97);ctx.bezierCurveTo(R*.12,R*.55,-R*.12,R*.55,0,R*.27);ctx.stroke();
      ctx.restore();
    }
  });
  const n2=det*2+8;
  withLW(ctx,th*.5,()=>{for(let i=0;i<n2;i++){const a=i*τ/n2;line(ctx,cx+R*.28*Math.cos(a),cy+R*.28*Math.sin(a),cx+R*.97*Math.cos(a),cy+R*.97*Math.sin(a));}});
  withLW(ctx,th*.7,()=>{for(let i=0;i<n2/2;i++){const a=i*τ/(n2/2)+τ/(n2*2);ctx.save();ctx.translate(cx+R*.55*Math.cos(a),cy+R*.55*Math.sin(a));ctx.rotate(a+Math.PI/2);star(ctx,0,0,R*.06,R*.03,6);ctx.restore();}});
  withLW(ctx,th*1.5,()=>rect(ctx,x,y,w,h));
},
gothic(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*2.5,()=>rect(ctx,x,y,w,h));
  withLW(ctx,th*.7,()=>rect(ctx,x+th*7,y+th*7,w-th*14,h-th*14));
  withLW(ctx,th*.3,()=>rect(ctx,x+th*11,y+th*11,w-th*22,h-th*22));
  const n=det+4;const aw=w/n;
  withLW(ctx,th,()=>{
    for(let i=0;i<n;i++){gothicArch(ctx,x+aw*i,y,aw,aw*1.4,th);}
    for(let i=0;i<n;i++){ctx.save();ctx.translate(x+aw*i+aw,y+h);ctx.scale(-1,-1);gothicArch(ctx,0,0,aw,aw*1.4,th);ctx.restore();}
    const an=Math.ceil(n*h/w),ah=h/an;
    for(let i=0;i<an;i++){
      ctx.save();ctx.translate(x,y+ah*i);ctx.rotate(Math.PI/2);gothicArch(ctx,0,0,ah,Math.min(aw*1.4,ah*.9),th);ctx.restore();
      ctx.save();ctx.translate(x+w,y+ah*(i+1));ctx.rotate(-Math.PI/2);gothicArch(ctx,0,0,ah,Math.min(aw*1.4,ah*.9),th);ctx.restore();
    }
  });
  [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach(([cx,cy])=>{
    ctx.save();ctx.translate(cx,cy);
    withLW(ctx,th,()=>{circle(ctx,0,0,aw*.6);star(ctx,0,0,aw*.6,aw*.35,6);});
    withLW(ctx,th*.5,()=>circle(ctx,0,0,aw*.35));
    dot(ctx,0,0,th);ctx.restore();
  });
},
hud(ctx,x,y,w,h,fc,th,det){
  const c=Math.min(w,h)*.042;
  withLW(ctx,th*3,()=>oct(ctx,x,y,w,h,c));
  withLW(ctx,th*.7,()=>oct(ctx,x+c*2.5,y+c*2.5,w-c*5,h-c*5,c*.6));
  withLW(ctx,th*.3,()=>oct(ctx,x+c*4,y+c*4,w-c*8,h-c*8,c*.3));
  const n=det*4+10,bw=w*.38/(n);
  for(let i=0;i<n;i++){
    const v=.15+.85*((Math.sin(i*.8)*.5+.5));
    ctx.globalAlpha=v;withLW(ctx,th*.3,()=>{rect(ctx,x+c*5+i*(bw+.8),y+c*.35,bw,th*3);rect(ctx,x+w-c*5-(i+1)*(bw+.8),y+c*.35,bw,th*3);rect(ctx,x+c*5+i*(bw+.8),y+h-c*.35-th*3,bw,th*3);rect(ctx,x+w-c*5-(i+1)*(bw+.8),y+h-c*.35-th*3,bw,th*3);});ctx.globalAlpha=1;
  }
  const nt=det*4+8;
  for(let i=0;i<nt;i++){
    const t=(i+.5)/nt;const f=i%4===0?th*5:i%2===0?th*3:th*1.8;
    withLW(ctx,th*.6,()=>{line(ctx,x+w*t,y,x+w*t,y-f);line(ctx,x+w*t,y+h,x+w*t,y+h+f);line(ctx,x,y+h*t,x-f,y+h*t);line(ctx,x+w,y+h*t,x+w+f,y+h*t);});
    if(i%4===0){withLW(ctx,th*.3,()=>{line(ctx,x+w*t-th,y-f,x+w*t+th,y-f);line(ctx,x+w*t-th,y+h+f,x+w*t+th,y+h+f);});}
  }
  [[x,y,1,1],[x+w,y,-1,1],[x+w,y+h,-1,-1],[x,y+h,1,-1]].forEach(([cx,cy,sx,sy])=>{
    ctx.save();ctx.translate(cx,cy);ctx.scale(sx,sy);
    withLW(ctx,th*3,()=>{line(ctx,c*3,0,0,0);line(ctx,0,0,0,c*3);});
    withLW(ctx,th*.7,()=>{line(ctx,c*2,0,c*.6,0);line(ctx,c*.6,0,c*.6,c*2);});
    withLW(ctx,th*.4,()=>ctx.beginPath()||(ctx.arc(0,0,c*.5,0,Math.PI/2))||ctx.stroke());
    withLW(ctx,th*.3,()=>{line(ctx,c*1.5,0,c*1.5,th*2);line(ctx,0,c*1.5,th*2,c*1.5);});
    dot(ctx,c*.3,c*.3,th*1.5);dot(ctx,0,0,th*.8);
    ctx.restore();
  });
},
oriental(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*2.5,()=>rect(ctx,x,y,w,h));

  withLW(ctx,th*.3,()=>rect(ctx,x+th*11,y+th*11,w-th*22,h-th*22));
  const n=det*2+5;const sw=w/n,shv=h/Math.ceil(n*h/w);
  withLW(ctx,th,()=>{
    for(let i=0;i<n;i++){meander(ctx,x+sw*i,y,sw,th*4,th);meander(ctx,x+sw*(n-1-i),y+h-th*4,sw,th*4,th);}
    const rn=Math.ceil(n*h/w);
    for(let i=0;i<rn;i++){ctx.save();ctx.translate(x,y+shv*i);ctx.rotate(Math.PI/2);meander(ctx,0,0,shv,th*4,th);ctx.restore();ctx.save();ctx.translate(x+w,y+shv*(rn-1-i)+shv);ctx.rotate(-Math.PI/2);meander(ctx,0,0,shv,th*4,th);ctx.restore();}
  });
  [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach(([cx,cy])=>{
    ctx.save();ctx.translate(cx,cy);
    withLW(ctx,th,()=>{for(let i=1;i<=3;i++)circle(ctx,0,0,th*i*2.5);});
    for(let i=0;i<8;i++){const a=i*τ/8;withLW(ctx,th*.5,()=>line(ctx,Math.cos(a)*th*2.7,Math.sin(a)*th*2.7,Math.cos(a)*th*7.5,Math.sin(a)*th*7.5));}
    dot(ctx,0,0,th);ctx.restore();
  });
},

  const n=det+4,ds=w/n;
  withLW(ctx,th*1.2,()=>{
    for(let i=0;i<n;i++){rune(ctx,x+ds*(i+.5),y+th*3,th*2.5,i%8);rune(ctx,x+ds*(i+.5),y+h-th*3,th*2.5,(i+4)%8);}
    const rn=Math.ceil(n*h/w),rs=h/rn;
    for(let i=0;i<rn;i++){rune(ctx,x+th*3,y+rs*(i+.5),th*2.5,(i+2)%8);rune(ctx,x+w-th*3,y+rs*(i+.5),th*2.5,(i+6)%8);}

    withLW(ctx,th*.5,()=>circle(ctx,0,0,th*5.5));
    dot(ctx,0,0,th);ctx.restore();
  });
},
vintage(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*3,()=>rect(ctx,x,y,w,h));
  ctx.save();ctx.setLineDash([th*5,th*1.5]);withLW(ctx,th,()=>rect(ctx,x+th*7,y+th*7,w-th*14,h-th*14));ctx.restore();
  withLW(ctx,th*.5,()=>rect(ctx,x+th*11,y+th*11,w-th*22,h-th*22));

    dot(ctx,0,0,th);ctx.restore();
  });
  const n=det+4;
  for(let i=1;i<n;i++){
    const t=i/n;
    [[x+w*t,y,0],[x+w*t,y+h,Math.PI],[x,y+h*t,Math.PI/2],[x+w,y+h*t,-Math.PI/2]].forEach(([px,py,rot])=>{
      ctx.save();ctx.translate(px,py);ctx.rotate(rot);
      withLW(ctx,th*.8,()=>{

        ctx.beginPath();ctx.arc(-th*1.5,-th*.8,th*.7,0,τ);ctx.stroke();
        ctx.beginPath();ctx.arc(th*1.5,-th*.8,th*.7,0,τ);ctx.stroke();
      });ctx.restore();
    });
  }
},
biomech(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*2,()=>rect(ctx,x,y,w,h));
  withLW(ctx,th*.6,()=>rr(ctx,x+th*6,y+th*6,w-th*12,h-th*12,th*4));
  const step=Math.min(w,h)/(det*2+4);
  const nc=Math.floor(w/step),nr=Math.floor(h/step);
  withLW(ctx,th*.8,()=>{
    for(let i=0;i<nc;i++){
      const bx=x+step*i,by=y;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.bezierCurveTo(bx+step*.2,by-th*3,bx+step*.8,by-th*3,bx+step,by);ctx.stroke();
      ctx.beginPath();ctx.moveTo(bx,by+h);ctx.bezierCurveTo(bx+step*.2,by+h+th*3,bx+step*.8,by+h+th*3,bx+step,by+h);ctx.stroke();
      if(i%3===0){dot(ctx,bx+step*.5,by-th*1.5,th*1.2);dot(ctx,bx+step*.5,by+h+th*1.5,th*1.2);}
    }
    const rn=Math.ceil(n*h/w)||nr;
    for(let i=0;i<rn;i++){
      const bx=x,by=y+step*i;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.bezierCurveTo(bx-th*3,by+step*.2,bx-th*3,by+step*.8,bx,by+step);ctx.stroke();
      ctx.beginPath();ctx.moveTo(bx+w,by);ctx.bezierCurveTo(bx+w+th*3,by+step*.2,bx+w+th*3,by+step*.8,bx+w,by+step);ctx.stroke();
      if(i%3===0){dot(ctx,bx-th*1.5,by+step*.5,th*1.2);dot(ctx,bx+w+th*1.5,by+step*.5,th*1.2);}
    }
  });
  [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach(([cx,cy])=>{
    ctx.save();ctx.translate(cx,cy);
    const r=step*.9;
    withLW(ctx,th,()=>{
      for(let i=0;i<8;i++){ctx.save();ctx.rotate(i*τ/8);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(r*.3,r*.1,r*.5,r*.4,r*.7,r*.3);ctx.bezierCurveTo(r*.9,r*.2,r*.8,-r*.1,r,0);ctx.stroke();ctx.restore();}
      circle(ctx,0,0,r*.25);
    });dot(ctx,0,0,th);ctx.restore();
  });
},
tribal(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*3,()=>rect(ctx,x,y,w,h));

    const rn=Math.ceil(n*h/w);
    for(let i=0;i<rn;i++){tribalUnit(ctx,x,y+sh*i,th*5,sh,true);tribalUnit(ctx,x+w-th*5,y+sh*(rn-1-i),th*5,sh,true);}

      ctx.beginPath();ctx.moveTo(th*2,th*2);ctx.lineTo(th*5,th*2);ctx.lineTo(th*3.5,th*5);ctx.lineTo(th*2,th*5);ctx.closePath();ctx.stroke();
    });ctx.restore();
  });
},
steampunk(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*2.5,()=>rect(ctx,x,y,w,h));
  withLW(ctx,th*.7,()=>rect(ctx,x+th*7,y+th*7,w-th*14,h-th*14));
  const gr=Math.min(w,h)*.08;
  const gears=[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x+w/2,y],[x+w/2,y+h],[x,y+h/2],[x+w,y+h/2]];
  gears.slice(0,4+det%5).forEach(([cx,cy],i)=>{
    ctx.save();ctx.translate(cx,cy);
    const r=gr*(i<4?.85:.6),teeth=det+8+i*2;
    withLW(ctx,th,()=>{
      circle(ctx,0,0,r*.7);circle(ctx,0,0,r*.4);circle(ctx,0,0,r*.2);
      for(let t=0;t<teeth;t++){const a=t*τ/teeth;const ox=Math.cos(a)*r*.72,oy=Math.sin(a)*r*.72;ctx.save();ctx.translate(ox,oy);ctx.rotate(a);ctx.strokeRect(-r*.08,-r*.08,r*.16,r*.22);ctx.restore();}
    });
    withLW(ctx,th*.5,()=>{for(let i=0;i<6;i++){const a=i*τ/6;line(ctx,Math.cos(a)*r*.22,Math.sin(a)*r*.22,Math.cos(a)*r*.38,Math.sin(a)*r*.38);}});
    dot(ctx,0,0,th);ctx.restore();
  });
  const n=det+3,sw=w/n;
  withLW(ctx,th*.8,()=>{
    for(let i=0;i<n;i++){
      const bx=x+sw*(i+.5);
      ctx.save();ctx.translate(bx,y);pipeJoint(ctx,th*2,th);ctx.restore();
      ctx.save();ctx.translate(bx,y+h);pipeJoint(ctx,th*2,th);ctx.restore();
    }
  });
},
lacework(ctx,x,y,w,h,fc,th,det){

      circle(ctx,0,0,step*.35);

aztec(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*3,()=>rect(ctx,x,y,w,h));

    for(let i=0;i<nr;i++){aztecGlyph(ctx,x+step*.5,y+step*(i+.5),step*.45,th,(i+2)%6);aztecGlyph(ctx,x+w-step*.5,y+step*(i+.5),step*.45,th,(i+5)%6);}

      ctx.beginPath();ctx.moveTo(step*.3,step*.3);ctx.lineTo(step,step*.3);ctx.lineTo(step,step*.7);ctx.lineTo(step*.7,step*.7);ctx.lineTo(step*.7,step);ctx.lineTo(step*.3,step);ctx.closePath();ctx.stroke();
    });ctx.restore();

quantum(ctx, x, y, w, h, fc, th, det) {
  const cx = x + w / 2, cy = y + h / 2;
  const minS = Math.min(w, h);

  // 1. Triple-ring outer boundary (octagonal)
  const cuts = [minS * 0.04, minS * 0.025, minS * 0.01];
  const offs  = [0, th * 5, th * 9];
  cuts.forEach((c, i) => {
    const lw = i === 0 ? th * 3 : i === 1 ? th * 0.9 : th * 0.35;
    const oo = offs[i];
    withLW(ctx, lw, () => oct(ctx, x + oo, y + oo, w - oo * 2, h - oo * 2, c));
  });

  // 2. Lissajous interference network — 4 curves with different freq ratios
  const lissParams = [
    { a: 3, b: 2, delta: 0,            alpha: 0.55 },
    { a: 5, b: 4, delta: Math.PI / 4,  alpha: 0.35 },
    { a: 2, b: 3, delta: Math.PI / 6,  alpha: 0.30 },
    { a: 4, b: 3, delta: Math.PI / 3,  alpha: 0.20 },
  ];
  const rx = w * 0.44, ry = h * 0.44;
  withLW(ctx, th * 0.55, () => {
    lissParams.forEach(({ a, b, delta, alpha }) => {
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      const segs = det * 30 + 180;
      for (let i = 0; i <= segs; i++) {
        const t2 = (i / segs) * Math.PI * 2;
        const px = cx + rx * Math.sin(a * t2 + delta);
        const py = cy + ry * Math.sin(b * t2);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  });

  // 3. Nested orbital ellipses (tilted at different angles)
  const orbitCount = det + 4;
  withLW(ctx, th * 0.45, () => {
    ctx.globalAlpha = 0.42;
    for (let i = 0; i < orbitCount; i++) {
      const angle = (i / orbitCount) * Math.PI;
      const r1 = minS * (0.12 + i * 0.06);
      const r2 = r1 * 0.55;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.ellipse(0, 0, r1, r2, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  });

  // 4. Interference dot grid — standing-wave pattern
  const gridStep = minS / (det * 3 + 8);
  withLW(ctx, th * 0.3, () => {
    for (let gx = x; gx <= x + w; gx += gridStep) {
      for (let gy = y; gy <= y + h; gy += gridStep) {
        const dx = (gx - cx) / rx, dy = (gy - cy) / ry;
        const wave = Math.sin(dx * Math.PI * 3) * Math.cos(dy * Math.PI * 3);
        if (wave > 0.6) {
          const sz = th * (0.5 + wave * 0.8);
          ctx.globalAlpha = wave * 0.6;
          dot(ctx, gx, gy, sz);
        }
      }
    }
    ctx.globalAlpha = 1;
  });

  // 5. Radial starburst from centre
  const rayCount = det * 4 + 16;
  withLW(ctx, th * 0.4, () => {
    ctx.globalAlpha = 0.28;
    for (let i = 0; i < rayCount; i++) {
      const ang = (i / rayCount) * Math.PI * 2;
      const innerR = minS * 0.04;
      const outerR = minS * (i % 4 === 0 ? 0.40 : i % 2 === 0 ? 0.28 : 0.16);
      line(ctx,
        cx + Math.cos(ang) * innerR, cy + Math.sin(ang) * innerR,
        cx + Math.cos(ang) * outerR, cy + Math.sin(ang) * outerR
      );
    }
    ctx.globalAlpha = 1;
  });

  // 6. Corner quantum brackets (sharp L-brackets)
  const cs = minS * 0.10;
  withLW(ctx, th * 2.5, () => {
    [[x, y, 1, 1], [x + w, y, -1, 1], [x + w, y + h, -1, -1], [x, y + h, 1, -1]]
      .forEach(([bx2, by2, sx, sy]) => {
        ctx.save(); ctx.translate(bx2, by2); ctx.scale(sx, sy);
        ctx.beginPath();
        ctx.moveTo(0, cs); ctx.lineTo(0, 0); ctx.lineTo(cs, 0);
        ctx.stroke();
        withLW(ctx, th * 0.8, () => {
          ctx.beginPath();
          ctx.moveTo(cs * 0.4, 0); ctx.lineTo(cs * 0.4, cs * 0.4); ctx.lineTo(0, cs * 0.4);
          ctx.stroke();
        });
        dot(ctx, cs * 0.15, cs * 0.15, th * 1.2);
        ctx.restore();
      });
  });

  // 7. Mid-edge tick marks with quantum nodes
  const tickPts = [
    [cx, y, 0], [cx, y + h, Math.PI], [x, cy, Math.PI / 2], [x + w, cy, -Math.PI / 2]
  ];
  withLW(ctx, th, () => {
    tickPts.forEach(([px, py, rot]) => {
      ctx.save(); ctx.translate(px, py); ctx.rotate(rot);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -th * 4.5); ctx.stroke();
      withLW(ctx, th * 0.5, () => {
        ctx.beginPath(); ctx.moveTo(-th * 2, -th * 2.5); ctx.lineTo(th * 2, -th * 2.5); ctx.stroke();
      });
      dot(ctx, 0, 0, th * 1.3);
      ctx.restore();
    });
  });

  // 8. Central quantum sigil
  withLW(ctx, th * 1.2, () => {
    circle(ctx, cx, cy, minS * 0.035);
    circle(ctx, cx, cy, minS * 0.018);
  });
  withLW(ctx, th * 0.5, () => {
    for (let i = 0; i < 8; i++) {
      const ang = i * Math.PI / 4;
      line(ctx,
        cx + Math.cos(ang) * minS * 0.038,
        cy + Math.sin(ang) * minS * 0.038,
        cx + Math.cos(ang) * minS * 0.065,
        cy + Math.sin(ang) * minS * 0.065
      );
    }
  });
  dot(ctx, cx, cy, th * 1.5);
},

neogothic(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*3,()=>rect(ctx,x,y,w,h));
  withLW(ctx,th*.8,()=>rect(ctx,x+th*6,y+th*6,w-th*12,h-th*12));
  withLW(ctx,th*.3,()=>rect(ctx,x+th*10,y+th*10,w-th*20,h-th*20));
  const n=det+4,aw=w/n;
  withLW(ctx,th*.9,()=>{
    for(let i=0;i<n;i++){
      neoArch(ctx,x+aw*i,y,aw,aw*1.6,th);
      ctx.save();ctx.translate(x+aw*i+aw,y+h);ctx.scale(-1,-1);neoArch(ctx,0,0,aw,aw*1.6,th);ctx.restore();
    }
    const an=Math.ceil(n*h/w),ah=h/an;
    for(let i=0;i<an;i++){
      ctx.save();ctx.translate(x,y+ah*i);ctx.rotate(Math.PI/2);neoArch(ctx,0,0,ah,Math.min(aw*1.6,ah*.95),th);ctx.restore();
      ctx.save();ctx.translate(x+w,y+ah*(i+1));ctx.rotate(-Math.PI/2);neoArch(ctx,0,0,ah,Math.min(aw*1.6,ah*.95),th);ctx.restore();
    }
  });
  [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach(([cx,cy])=>{
    ctx.save();ctx.translate(cx,cy);
    withLW(ctx,th,()=>{star(ctx,0,0,aw*.75,aw*.4,8);circle(ctx,0,0,aw*.4);});
    withLW(ctx,th*.4,()=>circle(ctx,0,0,aw*.2));
    dot(ctx,0,0,th);ctx.restore();
  });
},
arabesque(ctx,x,y,w,h,fc,th,det){
  withLW(ctx,th*2.5,()=>rect(ctx,x,y,w,h));
  withLW(ctx,th*.5,()=>rect(ctx,x+th*7,y+th*7,w-th*14,h-th*14));
  const step=Math.min(w,h)/(det*2+3);
  const nc=Math.floor(w/step)+1,nr=Math.floor(h/step)+1;
  withLW(ctx,th*.7,()=>{
    for(let i=0;i<nc;i++){arabesqueCell(ctx,x+i*step,y,step,th);arabesqueCell(ctx,x+i*step,y+h-step,step,th);}
    for(let i=1;i<nr-1;i++){arabesqueCell(ctx,x,y+i*step,step,th);arabesqueCell(ctx,x+w-step,y+i*step,step,th);}
  });
  [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach(([cx,cy])=>{
    ctx.save();ctx.translate(cx,cy);
    const r=step*.9;
    withLW(ctx,th,()=>{
      for(let i=0;i<8;i++){ctx.save();ctx.rotate(i*τ/8);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(r*.3,r*.1,r*.5,r*.4,r*.7,r*.3);ctx.bezierCurveTo(r*.9,r*.2,r*.8,-r*.1,r,0);ctx.stroke();ctx.restore();}
      circle(ctx,0,0,r*.25);
    });dot(ctx,0,0,th);ctx.restore();
  });
},

// ════════════════════════════════════════════════════════════
//  POSTER LAYOUTS — композиционные шаблоны (digital poster)
//  не декоративные рамки, а готовые "обложки"
// ════════════════════════════════════════════════════════════
swiss(ctx,x,y,w,h,fc,th,det,W,H,t){
  const sz=Math.min(w,h),F=fc;
  const year=new Date().getFullYear();
  // Тонкая внешняя рамка
  withLW(ctx,th*0.7,()=>rect(ctx,x,y,w,h));
  // Top-left wordmark
  ctx.save();ctx.fillStyle=F;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font=`700 ${sz*0.044}px "Bebas Neue", sans-serif`;
  ctx.fillText('RICOLE / PROJECT',x+sz*0.035,y+sz*0.035);
  ctx.font=`400 ${sz*0.013}px "Space Mono", monospace`;
  ctx.fillText(`VOL. XII · EDITION ${year}`,x+sz*0.035,y+sz*0.092);
  ctx.fillText('KINETIC TYPOGRAPHY ENGINE',x+sz*0.035,y+sz*0.112);
  ctx.restore();
  // Top-right serial block
  ctx.save();ctx.fillStyle=F;ctx.font=`400 ${sz*0.012}px "Space Mono", monospace`;
  ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillText('ISBN 978-0-RIC-2026',x+w-sz*0.035,y+sz*0.035);
  ctx.fillText(`NO. ${String(((W*H)%999)+1).padStart(3,'0')}`,x+w-sz*0.035,y+sz*0.055);
  ctx.fillText(`${W}×${H} · ${(w/h).toFixed(2)}:1`,x+w-sz*0.035,y+sz*0.075);
  ctx.restore();
  // Верхний divider
  const divY=y+sz*0.145;
  withLW(ctx,th*0.5,()=>line(ctx,x+sz*0.035,divY,x+w-sz*0.035,divY));
  // Вертикальная дата справа
  ctx.save();ctx.translate(x+w-sz*0.022,y+h/2);ctx.rotate(-Math.PI/2);
  ctx.font=`700 ${sz*0.022}px "Bebas Neue", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=F;
  ctx.fillText('— PRINTED IN RICOLE PROJECT · 2026 —',0,0);
  ctx.restore();
  // Тонкая колоночная сетка (slim columns)
  ctx.save();ctx.globalAlpha=0.22;
  withLW(ctx,th*0.3,()=>{
    const cols=6,yA=y+sz*0.18,yB=y+h-sz*0.13;
    for(let i=1;i<cols;i++){const cx=x+(w/cols)*i;ctx.beginPath();
      for(let py=yA;py<yB;py+=sz*0.035){ctx.moveTo(cx,py);ctx.lineTo(cx,py+sz*0.018);}
      ctx.stroke();}
  });ctx.restore();
  // Нижний divider
  const botY=y+h-sz*0.082;
  withLW(ctx,th*0.5,()=>line(ctx,x+sz*0.035,botY,x+w-sz*0.035,botY));
  // Бренд + пагинация снизу
  ctx.save();ctx.fillStyle=F;
  ctx.font=`700 ${sz*0.026}px "Bebas Neue", sans-serif`;ctx.textAlign='left';ctx.textBaseline='bottom';
  ctx.fillText('01 / 12',x+sz*0.035,y+h-sz*0.028);
  ctx.font=`400 ${sz*0.012}px "Space Mono", monospace`;
  ctx.fillText('— FRAMES BY RICOLE PROJECT —',x+sz*0.14,y+h-sz*0.03);
  ctx.restore();
  // Псевдо-баркод bottom-right
  ctx.save();ctx.fillStyle=F;
  const barX=x+w-sz*0.22,barY=y+h-sz*0.058;
  for(let i=0;i<36;i++){
    const seed=(i*13+7)%17;
    const ww=seed<3?th*1.6:seed<8?th*0.55:th*0.3;
    ctx.fillRect(barX+i*sz*0.0055,barY,ww,sz*0.028);
  }ctx.restore();
  // Реперные крестики (registration marks) в углах
  [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach(([cx,cy])=>{
    ctx.save();ctx.translate(cx,cy);const r=sz*0.013;
    withLW(ctx,th*0.4,()=>{circle(ctx,0,0,r);line(ctx,-r*1.7,0,r*1.7,0);line(ctx,0,-r*1.7,0,r*1.7);});
    ctx.restore();
  });
},

brutal(ctx,x,y,w,h,fc,th,det,W,H,t){
  const sz=Math.min(w,h),F=fc;
  // Тяжёлые верх + правый край
  withLW(ctx,th*5,()=>{line(ctx,x,y,x+w,y);line(ctx,x+w,y,x+w,y+h);});
  // Тонкие нижний + левый
  withLW(ctx,th*0.6,()=>{line(ctx,x,y+h,x+w,y+h);line(ctx,x,y,x,y+h);});
  // Большой блок в углу слева (solid)
  ctx.save();ctx.fillStyle=F;
  ctx.fillRect(x,y+h*0.62,sz*0.10,h*0.38);
  ctx.restore();
  // Вертикальный лейбл на чёрном блоке
  ctx.save();ctx.translate(x+sz*0.05,y+h*0.81);ctx.rotate(-Math.PI/2);
  ctx.fillStyle='#000';ctx.font=`900 ${sz*0.040}px "Bebas Neue", sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('RICOLE-01',0,0);ctx.restore();
  // Гигантская цифра "01" в правом нижнем углу
  ctx.save();ctx.fillStyle=F;
  ctx.font=`900 ${sz*0.34}px "Bebas Neue", sans-serif`;
  ctx.textAlign='right';ctx.textBaseline='bottom';
  ctx.fillText('01',x+w-sz*0.04,y+h-sz*0.04);ctx.restore();
  // Диагональный slash через угол top-left
  withLW(ctx,th*3,()=>{
    line(ctx,x,y+sz*0.16,x+sz*0.28,y);
    line(ctx,x+sz*0.04,y+sz*0.20,x+sz*0.22,y+sz*0.04);
  });
  // Большой год в углу top-left
  ctx.save();ctx.fillStyle=F;
  ctx.font=`900 ${sz*0.062}px "Bebas Neue", sans-serif`;
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('2026',x+sz*0.32,y+sz*0.04);
  ctx.font=`400 ${sz*0.012}px "Space Mono", monospace`;
  ctx.fillText('// FRAME-SYSTEM v.6 // ISSUE №01 // KINETIC',x+sz*0.32,y+sz*0.108);
  ctx.fillText('RICOLE / PROJECT — RAW EDITION',x+sz*0.32,y+sz*0.128);
  ctx.restore();
  // Мелкие случайно-выглядящие annotation-rectangles
  ctx.save();ctx.fillStyle=F;
  const annot=[[0.42,0.42,0.08,0.012],[0.55,0.42,0.04,0.012],[0.42,0.46,0.14,0.012]];
  annot.forEach(([px,py,pw,ph])=>ctx.fillRect(x+w*px,y+h*py,w*pw,sz*ph));
  ctx.restore();
  // Большой текстовый блок-нашлёпка слева внизу
  ctx.save();ctx.fillStyle=F;
  ctx.font=`700 ${sz*0.018}px "Space Mono", monospace`;
  ctx.textAlign='left';ctx.textBaseline='bottom';
  ctx.fillText('STR. PROJECT.RICOLE.001 / NO REGRESSION / BUILD STABLE',x+sz*0.13,y+h-sz*0.058);
  ctx.fillText('LAT 52°22′N · LON 4°53′E · ROOM 04 · ANALOG MODE',x+sz*0.13,y+h-sz*0.035);
  ctx.restore();
  // Псевдо-баркод сверху над цифрами
  ctx.save();ctx.fillStyle=F;
  const bx=x+w-sz*0.30,by=y+sz*0.04;
  for(let i=0;i<24;i++){const seed=(i*17+3)%19;
    const ww=seed<3?th*1.4:seed<9?th*0.5:th*0.3;
    ctx.fillRect(bx+i*sz*0.0080,by,ww,sz*0.026);}
  ctx.restore();
},

vapor(ctx,x,y,w,h,fc,th,det,W,H,t){
  const sz=Math.min(w,h);
  const PINK='#ff2ad8',CYAN='#00e5ff',MAG='#ff2dd6',WH='#ffffff';
  // Solid horizon line делящая верх/низ
  const horY=y+h*0.55;
  // Нижняя сетка-перспектива (vaporwave grid floor)
  ctx.save();ctx.strokeStyle=PINK;ctx.globalAlpha=0.85;
  withLW(ctx,th*0.8,()=>{
    // продольные сходящиеся линии
    const cols=14,vx=x+w/2,vy=horY;
    for(let i=0;i<=cols;i++){const k=(i/cols-0.5)*2;
      const bx=x+w/2+k*w*0.65;
      ctx.beginPath();ctx.moveTo(bx,y+h);ctx.lineTo(vx,vy);ctx.stroke();}
    // горизонтальные слои с перспективным сжатием
    const rows=10;
    for(let i=1;i<=rows;i++){const k=Math.pow(i/rows,2.2);
      const yy=horY+k*(y+h-horY);
      const xw=k*(w*0.65);
      ctx.beginPath();ctx.moveTo(x+w/2-xw,yy);ctx.lineTo(x+w/2+xw,yy);ctx.stroke();}
  });ctx.restore();
  // Half-sun над горизонтом с горизонтальными вырезами
  ctx.save();ctx.fillStyle=PINK;
  const sunR=sz*0.20,sunCx=x+w/2,sunCy=horY;
  ctx.beginPath();ctx.arc(sunCx,sunCy,sunR,Math.PI,0);ctx.fill();
  // вырезы (cutout stripes)
  ctx.globalCompositeOperation='destination-out';
  for(let i=0;i<6;i++){const yy=sunCy-sunR*(0.45+i*0.09);
    ctx.fillRect(sunCx-sunR,yy,sunR*2,sz*(0.012+i*0.005));}
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
  // Линия горизонта
  ctx.save();ctx.strokeStyle=CYAN;
  withLW(ctx,th*1.5,()=>line(ctx,x+sz*0.06,horY,x+w-sz*0.06,horY));
  ctx.restore();
  // Заголовок с хроматическим оффсетом (PINK + CYAN ghosts + WH base)
  ctx.save();ctx.font=`900 ${sz*0.13}px "Bebas Neue", sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const tx=x+w/2,ty=y+h*0.20;
  ctx.fillStyle=CYAN;ctx.fillText('RICOLE',tx-sz*0.014,ty);
  ctx.fillStyle=MAG;ctx.fillText('RICOLE',tx+sz*0.014,ty);
  ctx.fillStyle=WH;ctx.fillText('RICOLE',tx,ty);
  ctx.font=`700 ${sz*0.022}px "Space Mono", monospace`;
  ctx.fillStyle=PINK;
  ctx.fillText('— ESTABLISHED 2026 —',tx,ty+sz*0.078);
  ctx.restore();
  // Звёздные искры (sparkles)
  ctx.save();ctx.fillStyle=WH;
  const stars=[[0.12,0.10],[0.86,0.14],[0.18,0.30],[0.78,0.32],[0.07,0.43],[0.92,0.45]];
  stars.forEach(([px,py])=>{const cx=x+w*px,cy=y+h*py,r=sz*0.009;
    ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx+r*0.25,cy-r*0.25);ctx.lineTo(cx+r,cy);
    ctx.lineTo(cx+r*0.25,cy+r*0.25);ctx.lineTo(cx,cy+r);ctx.lineTo(cx-r*0.25,cy+r*0.25);
    ctx.lineTo(cx-r,cy);ctx.lineTo(cx-r*0.25,cy-r*0.25);ctx.closePath();ctx.fill();});
  ctx.restore();
  // Scan lines
  ctx.save();ctx.globalAlpha=0.10;ctx.fillStyle='#000';
  for(let yy=y;yy<y+h;yy+=th*2.2)ctx.fillRect(x,yy,w,th*0.8);
  ctx.restore();
  // Тонкая внешняя рамка (CYAN)
  ctx.save();ctx.strokeStyle=CYAN;
  withLW(ctx,th*0.6,()=>rect(ctx,x,y,w,h));
  ctx.restore();
},

broadcast(ctx,x,y,w,h,fc,th,det,W,H,t){
  const sz=Math.min(w,h),F=fc;
  // Top header band (заливка)
  const headH=sz*0.075;
  ctx.save();ctx.fillStyle=F;ctx.fillRect(x,y,w,headH);ctx.restore();
  // REC indicator + timestamp + LIVE
  ctx.save();ctx.fillStyle='#000';
  ctx.font=`700 ${sz*0.025}px "Space Mono", monospace`;
  ctx.textAlign='left';ctx.textBaseline='middle';
  // RED dot (пульсирующий)
  const dotR=sz*0.013;
  ctx.fillStyle='#ff2d55';
  dot(ctx,x+sz*0.04+dotR,y+headH/2,dotR);
  ctx.fillStyle='#000';
  ctx.fillText('● REC',x+sz*0.075,y+headH/2);
  ctx.fillText('RICOLE / BROADCAST 01',x+sz*0.18,y+headH/2);
  // Timestamp в правом углу header
  ctx.textAlign='right';
  const ts=`${String(Math.floor(t)%60).padStart(2,'0')}:${String(Math.floor(t*1000)%1000).padStart(3,'0')}`;
  ctx.fillText(`T+ ${ts}`,x+w-sz*0.075,y+headH/2);
  ctx.fillText('LIVE',x+w-sz*0.04,y+headH/2);
  ctx.restore();
  // Под header — горизонтальная тонкая линия
  withLW(ctx,th*0.4,()=>line(ctx,x,y+headH+sz*0.008,x+w,y+headH+sz*0.008));
  // Вертикальные chyron-метки слева и справа (CHANNEL / SIG)
  ctx.save();ctx.fillStyle=F;
  ctx.font=`700 ${sz*0.014}px "Space Mono", monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.translate(x+sz*0.022,y+h*0.5);ctx.rotate(-Math.PI/2);
  ctx.fillText('CH.01 · SIG.OK · 60FPS',0,0);ctx.restore();
  ctx.save();ctx.fillStyle=F;
  ctx.font=`700 ${sz*0.014}px "Space Mono", monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.translate(x+w-sz*0.022,y+h*0.5);ctx.rotate(Math.PI/2);
  ctx.fillText('REC · ROLL.001 · MASTER',0,0);ctx.restore();
  // Lower-third banner
  const lwY=y+h*0.78,lwH=sz*0.085;
  ctx.save();ctx.fillStyle=F;
  ctx.fillRect(x+sz*0.04,lwY,w*0.45,lwH);
  // Тонкая полоска подложка
  ctx.globalAlpha=0.55;
  ctx.fillRect(x+sz*0.04,lwY+lwH+sz*0.004,w*0.28,sz*0.012);
  ctx.restore();
  // Текст внутри lower-third
  ctx.save();ctx.fillStyle='#000';
  ctx.font=`900 ${sz*0.045}px "Bebas Neue", sans-serif`;
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('TITLE / SLOT',x+sz*0.055,lwY+sz*0.011);
  ctx.font=`400 ${sz*0.013}px "Space Mono", monospace`;
  ctx.fillText('— subtitle area / kinetic type insert —',x+sz*0.055,lwY+sz*0.054);
  ctx.restore();
  // Угловые tracking crosshairs
  [[x,y+headH+sz*0.04],[x+w,y+headH+sz*0.04],[x+w,y+h],[x,y+h]].forEach(([cx,cy],i)=>{
    if(i>1)return; // только верхние два под header
    ctx.save();ctx.translate(cx,cy);const r=sz*0.020;
    const sx=cx===x?1:-1;
    withLW(ctx,th*1.4,()=>{line(ctx,sx*r*0.2,0,sx*r*1.4,0);line(ctx,0,r*0.2,0,r*1.4);});
    ctx.restore();
  });
  // Нижний ticker — серия мелких отметок
  const tkY=y+h-sz*0.030;
  ctx.save();ctx.fillStyle=F;
  for(let i=0;i<60;i++){const px=x+sz*0.04+i*((w-sz*0.08)/60);
    const hh=(i%7===0)?sz*0.018:(i%3===0)?sz*0.010:sz*0.005;
    ctx.fillRect(px,tkY,th*0.6,hh);}
  ctx.font=`400 ${sz*0.011}px "Space Mono", monospace`;
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('// SCRUB · 00:00 — 03:45 // FRAMES: 0/5400 //',x+sz*0.04,tkY+sz*0.025);
  ctx.restore();
  // Внешняя рамка тонкая
  withLW(ctx,th*0.6,()=>rect(ctx,x,y,w,h));
},

bauhaus(ctx,x,y,w,h,fc,th,det,W,H,t){
  const sz=Math.min(w,h),F=fc;
  const RED='#e63946',BLUE='#1d3557',YEL='#ffd60a';
  // Тонкая внешняя рамка
  withLW(ctx,th*0.7,()=>rect(ctx,x,y,w,h));
  // Заливочный красный квадрат — top-left угол
  ctx.save();ctx.fillStyle=RED;
  ctx.fillRect(x+sz*0.04,y+sz*0.04,sz*0.22,sz*0.22);
  ctx.restore();
  // Жёлтый круг — bottom-right
  ctx.save();ctx.fillStyle=YEL;
  ctx.beginPath();ctx.arc(x+w-sz*0.16,y+h-sz*0.16,sz*0.13,0,τ);ctx.fill();
  ctx.restore();
  // Синий треугольник — bottom-left
  ctx.save();ctx.fillStyle=BLUE;
  ctx.beginPath();
  ctx.moveTo(x+sz*0.05,y+h-sz*0.05);
  ctx.lineTo(x+sz*0.32,y+h-sz*0.05);
  ctx.lineTo(x+sz*0.05,y+h-sz*0.30);
  ctx.closePath();ctx.fill();
  ctx.restore();
  // Толстая чёрная диагональ через композицию
  ctx.save();ctx.strokeStyle=F;
  withLW(ctx,th*3.5,()=>line(ctx,x+w*0.30,y,x+w,y+h*0.78));
  ctx.restore();
  // Большое число "01" в верхнем правом
  ctx.save();ctx.fillStyle=F;
  ctx.font=`900 ${sz*0.18}px "Bebas Neue", sans-serif`;
  ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillText('01',x+w-sz*0.04,y+sz*0.04);
  ctx.font=`700 ${sz*0.018}px "Space Mono", monospace`;
  ctx.fillText('— ISSUE —',x+w-sz*0.04,y+sz*0.215);
  ctx.restore();
  // Лейбл в центре композиции (мелкий)
  ctx.save();ctx.fillStyle=F;
  ctx.font=`900 ${sz*0.044}px "Bebas Neue", sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('RICOLE',x+w*0.5,y+h*0.50);
  ctx.font=`400 ${sz*0.014}px "Space Mono", monospace`;
  ctx.fillText('— BAUHAUS POSTER · MODULAR LAYOUT —',x+w*0.5,y+h*0.555);
  ctx.restore();
  // Маленький белый круг в красном квадрате
  ctx.save();ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(x+sz*0.04+sz*0.22-sz*0.04,y+sz*0.04+sz*0.04,sz*0.017,0,τ);ctx.fill();
  ctx.restore();
  // Тонкие annotation-рамки и засечки
  ctx.save();ctx.strokeStyle=F;ctx.fillStyle=F;
  withLW(ctx,th*0.4,()=>{
    line(ctx,x+sz*0.04,y+sz*0.30,x+sz*0.20,y+sz*0.30);
    line(ctx,x+sz*0.04,y+sz*0.30,x+sz*0.04,y+sz*0.34);
  });
  ctx.font=`400 ${sz*0.011}px "Space Mono", monospace`;
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('FIG. 01 — PRIMARY COLOR BLOCK',x+sz*0.04,y+sz*0.31);
  ctx.fillText('220 × 220 PX · #E63946',x+sz*0.04,y+sz*0.328);
  ctx.restore();
}
};

window.addEventListener('resize', draw);
draw();
</script>
