<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>CHROMATYPE — Рамки</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
<style>
/* ── Reset & Root ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #090909;
  --panel:   #111111;
  --surface: #161616;
  --border:  #222222;
  --accent:  #e8ff00;
  --danger:  #ff2d55;
  --text:    #efefef;
  --muted:   #484848;
  --mono:    'Space Mono', monospace;
  --display: 'Bebas Neue', cursive;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  overflow: hidden;
}

/* ── Header ───────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex-shrink: 0;
}
header h1 {
  font-family: var(--display);
  font-size: 24px;
  letter-spacing: 5px;
  color: var(--accent);
}
header nav { display: flex; gap: 2px; }
header nav a {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  padding: 6px 12px;
  border: 1px solid transparent;
  transition: color .15s, border-color .15s;
}
header nav a:hover { color: var(--text); border-color: var(--border); }
header nav a.active { color: var(--accent); border-color: var(--accent); }
header .header-right {
  margin-left: auto;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
}

/* ── Layout ───────────────────────────────────── */
.workspace {
  display: flex;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── Left Panel ───────────────────────────────── */
.panel {
  width: 220px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-label {
  padding: 12px 16px 8px;
  font-size: 8px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel-scroll::-webkit-scrollbar { width: 3px; }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Section ──────────────────────────────────── */
.section { display: flex; flex-direction: column; gap: 6px; }
.section > label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── Style grid ───────────────────────────────── */
.style-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
}
.sb {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 4px;
  font-size: 9px;
  cursor: pointer;
  text-align: center;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  line-height: 1.3;
  transition: border-color .12s, color .12s, background .12s;
}
.sb:hover { border-color: var(--muted); color: var(--text); }
.sb.on {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(232,255,0,.05);
}

/* ── Resolution grid ─────────────────────────── */
.res-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
}
.rb {
  padding: 5px 3px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: transparent;
  font-size: 9px;
  cursor: pointer;
  color: var(--muted);
  font-family: var(--mono);
  text-align: center;
  transition: border-color .12s, color .12s, background .12s;
}
.rb:hover { border-color: var(--muted); color: var(--text); }
.rb.on {
  background: var(--surface);
  color: var(--text);
  border-color: var(--muted);
  font-weight: 700;
}

/* ── Color palette ───────────────────────────── */
.palette {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 6px;
}
.pc {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  flex-shrink: 0;
  transition: border-color .12s, transform .12s;
}
.pc:hover { transform: scale(1.15); }
.pc.on { border-color: var(--text); }

.color-custom label {
  display: block;
  font-size: 9px;
  color: var(--muted);
  margin-bottom: 4px;
  letter-spacing: 1px;
}
.color-custom input[type=color] {
  width: 100%;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0;
  background: none;
  cursor: pointer;
}
.color-custom input[type=color]:hover { border-color: var(--muted); }

/* ── Range row ───────────────────────────────── */
.range-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.range-row label {
  font-size: 9px;
  color: var(--muted);
  flex: 1;
  letter-spacing: 0;
}
.range-row span {
  font-size: 10px;
  font-weight: 700;
  color: var(--text);
  min-width: 22px;
  text-align: right;
}
input[type=range] {
  width: 100%;
  -webkit-appearance: none;
  height: 2px;
  background: var(--border);
  outline: none;
  cursor: pointer;
  border-radius: 1px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

/* ── Buttons ─────────────────────────────────── */
.btn {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 9px 14px;
  cursor: pointer;
  border: 1px solid;
  transition: background .12s, color .12s;
  width: 100%;
}
.btn-ghost {
  background: transparent;
  color: var(--muted);
  border-color: var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--muted); }
.btn-dl {
  background: rgba(0, 180, 255, .08);
  color: #7ec8f0;
  border-color: rgba(0, 180, 255, .3);
  font-weight: 700;
}
.btn-dl:hover { background: rgba(0, 180, 255, .18); border-color: #7ec8f0; }

/* ── Canvas area ─────────────────────────────── */
.canvas-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  padding: 24px;
  overflow: hidden;
  position: relative;
}

/* Checkerboard bg to show transparency */
.canvas-wrap {
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--border);
  background:
    repeating-conic-gradient(#1a1a1a 0% 25%, #111 0% 50%)
    0 0 / 20px 20px;
}
canvas {
  display: block;
}

/* ── Info bar (bottom of canvas) ─────────────── */
.info-bar {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 14px;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--muted);
  pointer-events: none;
}
.info-bar span { color: var(--accent); font-weight: 700; }

/* ── Divider ─────────────────────────────────── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 2px 0;
}
</style>
</head>
<body>

<header>
  <h1>CHROMATYPE</h1>
  <nav>
    <a href="index.html">Главная</a>
    <a href="timing-editor.html">Редактор</a>
    <a href="frames.html" class="active">Рамки</a>
  </nav>
  <div class="header-right">Генератор рамок · PNG</div>
</header>

<div class="workspace">

  <!-- ══ LEFT PANEL ══ -->
  <div class="panel">
    <div class="panel-label">// ПАРАМЕТРЫ</div>
    <div class="panel-scroll">

      <!-- Разрешение -->
      <div class="section">
        <label>Разрешение</label>
        <div class="res-grid">
          <button class="rb on" onclick="setR(1920,1080,this)">1920×1080</button>
          <button class="rb"    onclick="setR(1280,720,this)">1280×720</button>
          <button class="rb"    onclick="setR(1080,1080,this)">1080×1080</button>
          <button class="rb"    onclick="setR(1080,1920,this)">1080×1920</button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Стиль -->
      <div class="section">
        <label>Стиль</label>
        <div class="style-grid" id="stg">
          <button class="sb on" data-s="baroque"   onclick="setS(this)">🏛 Барокко</button>
          <button class="sb"    data-s="cypher"    onclick="setS(this)">✒ Вензеля</button>
          <button class="sb"    data-s="futurism"  onclick="setS(this)">⬡ Футуризм</button>
          <button class="sb"    data-s="circuit"   onclick="setS(this)">⚡ Схема</button>
          <button class="sb"    data-s="celtic"    onclick="setS(this)">☘ Кельтика</button>
          <button class="sb"    data-s="artdeco"   onclick="setS(this)">◆ Арт-деко</button>
          <button class="sb"    data-s="mandala"   onclick="setS(this)">✦ Мандала</button>
          <button class="sb"    data-s="gothic"    onclick="setS(this)">⛪ Готика</button>
          <button class="sb"    data-s="hud"       onclick="setS(this)">◎ Sci-fi HUD</button>
          <button class="sb"    data-s="oriental"  onclick="setS(this)">⛩ Восток</button>
          <button class="sb"    data-s="nordic"    onclick="setS(this)">᛫ Руны</button>
          <button class="sb"    data-s="vintage"   onclick="setS(this)">❧ Vintage</button>
          <button class="sb"    data-s="biomech"   onclick="setS(this)">🦴 Биомех</button>
          <button class="sb"    data-s="tribal"    onclick="setS(this)">▲ Трайбл</button>
          <button class="sb"    data-s="steampunk" onclick="setS(this)">⚙ Стимпанк</button>
          <button class="sb"    data-s="lacework"  onclick="setS(this)">❄ Кружево</button>
          <button class="sb"    data-s="aztec"     onclick="setS(this)">☀ Ацтеки</button>
          <button class="sb"    data-s="quantum"   onclick="setS(this)">◈ Квантум</button>
          <button class="sb"    data-s="neogothic" onclick="setS(this)">✝ Нео-готика</button>
          <button class="sb"    data-s="arabesque" onclick="setS(this)">✾ Арабеск</button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Цвет -->
      <div class="section">
        <label>Цвет</label>
        <div class="palette" id="pal"></div>
        <div class="color-custom">
          <label>Свой цвет</label>
          <input type="color" id="fc" value="#d4a84b" oninput="clrP();draw()" />
        </div>
      </div>

      <div class="divider"></div>

      <!-- Параметры -->
      <div class="section">
        <label>Параметры</label>
        <div class="range-row">
          <label>Толщина</label>
          <span id="tv">3</span>
        </div>
        <input type="range" id="thk" min="1" max="10" value="3" step="1"
          oninput="document.getElementById('tv').textContent=this.value;draw()" />

        <div class="range-row" style="margin-top:4px">
          <label>Детализация</label>
          <span id="dv">6</span>
        </div>
        <input type="range" id="det" min="1" max="12" value="6" step="1"
          oninput="document.getElementById('dv').textContent=this.value;draw()" />

        <div class="range-row" style="margin-top:4px">
          <label>Отступ</label>
          <span id="pv">4</span>%
        </div>
        <input type="range" id="pad" min="0" max="25" value="4" step="1"
          oninput="document.getElementById('pv').textContent=this.value;draw()" />
      </div>

      <div class="divider"></div>

      <!-- Actions -->
      <div class="section">
        <button class="btn btn-ghost" onclick="draw()">↺ Обновить</button>
        <button class="btn btn-dl"   onclick="dl()">↓ Скачать PNG</button>
      </div>

    </div>
  </div>

  <!-- ══ CANVAS AREA ══ -->
  <div class="canvas-area" id="canvasArea">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="c"></canvas>
    </div>
    <div class="info-bar">
      <span id="infoRes">1920 × 1080</span>
      <span>·</span>
      <span id="infoStyle">BAROQUE</span>
      <span>·</span>
      PNG с прозрачным фоном
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════
   Frame Generator — adapted from frame_ultra_pro.html
   Встроен в CHROMATYPE как отдельная страница
═══════════════════════════════════════════════ */
const τ = Math.PI * 2;
let W = 1920, H = 1080, sty = 'baroque';

const COLS = [
  '#d4a84b','#e8e8e8','#aed6f1','#a29bfe',
  '#fd79a8','#55efc4','#e17055','#ffffff',
  '#c0392b','#2c3e50'
];

// ── Palette init ──────────────────────────────
const palEl = document.getElementById('pal');
COLS.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'pc' + (i === 0 ? ' on' : '');
  d.style.background = c;
  d.onclick = () => {
    document.getElementById('fc').value = c;
    palEl.querySelectorAll('.pc').forEach(p => p.classList.remove('on'));
    d.classList.add('on');
    draw();
  };
  palEl.appendChild(d);
});

function clrP() { palEl.querySelectorAll('.pc').forEach(p => p.classList.remove('on')); }

function setR(w, h, b) {
  W = w; H = h;
  document.querySelectorAll('.rb').forEach(r => r.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('infoRes').textContent = `${w} × ${h}`;
  draw();
}

function setS(b) {
  sty = b.dataset.s;
  document.querySelectorAll('.sb').forEach(s => s.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('infoStyle').textContent = sty.toUpperCase();
  draw();
}

function P() {
  return {
    fc:  document.getElementById('fc').value,
    th:  +document.getElementById('thk').value,
    det: +document.getElementById('det').value,
    pad: +document.getElementById('pad').value / 100,
  };
}

function makeCtx(w, h, el) {
  const area   = document.getElementById('canvasArea');
  const maxW   = area.clientWidth  - 80;
  const maxH   = area.clientHeight - 60;
  const sc     = Math.min(maxW / w, maxH / h, 1);
  el.width     = Math.round(w * sc);
  el.height    = Math.round(h * sc);
  const ctx    = el.getContext('2d');
  ctx.clearRect(0, 0, el.width, el.height);
  ctx.scale(sc, sc);
  return ctx;
}

function draw() {
  const p   = P();
  const ctx = makeCtx(W, H, document.getElementById('c'));
  render(ctx, W, H, p);
}

function dl() {
  const p = P();
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  render(ctx, W, H, p);
  const a = document.createElement('a');
  a.download = `frame_${sty}_${W}x${H}.png`;
  a.href = c.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function render(ctx, W, H, p) {
  const { fc, th, det, pad } = p;
  const mg = Math.min(W, H) * pad;
  ctx.strokeStyle = fc;
  ctx.fillStyle   = fc;
  ctx.lineWidth   = th;
  DRAW[sty](ctx, mg, mg, W - mg * 2, H - mg * 2, fc, th, det, W, H);
}

// ─── helpers ──────────────────────────────────
function line(ctx,x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function circle(ctx,x,y,r,fill=false){ctx.beginPath();ctx.arc(x,y,r,0,τ);fill?ctx.fill():ctx.stroke();}
function dot(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,τ);ctx.fill();}
function rect(ctx,x,y,w,h){ctx.strokeRect(x,y,w,h);}
function oct(ctx,x,y,w,h,c){ctx.beginPath();ctx.moveTo(x+c,y);ctx.lineTo(x+w-c,y);ctx.lineTo(x+w,y+c);ctx.lineTo(x+w,y+h-c);ctx.lineTo(x+w-c,y+h);ctx.lineTo(x+c,y+h);ctx.lineTo(x,y+h-c);ctx.lineTo(x,y+c);ctx.closePath();ctx.stroke();}
function polygon(ctx,cx,cy,r,n,a0=0){ctx.beginPath();for(let i=0;i<n;i++){const a=a0+i*τ/n;i?ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();ctx.stroke();}
function star(ctx,cx,cy,r1,r2,n,a0=0){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=a0+i*Math.PI/n;i?ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}ctx.closePath();ctx.stroke();}
function dline(ctx,x1,y1,x2,y2,dash){ctx.save();ctx.setLineDash(dash);line(ctx,x1,y1,x2,y2);ctx.setLineDash([]);ctx.restore();}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();ctx.stroke();}
function withLW(ctx,lw,fn){const old=ctx.lineWidth;ctx.lineWidth=lw;fn();ctx.lineWidth=old;}
function corners4(fn){[[1,1],[-1,1],[-1,-1],[1,-1]].forEach(([sx,sy])=>fn(sx,sy));}

// ─── sub-draw helpers ──────────────────────────
function circComp(ctx,x,y,sz,th,type){
  ctx.save();ctx.translate(x+sz/2,y);
  const h2=th*2;
  if(type==='resistor'){withLW(ctx,th*.8,()=>ctx.strokeRect(-sz*.28,-h2,sz*.56,h2*2));}
  else if(type==='cap'){withLW(ctx,th*.8,()=>{line(ctx,-sz*.35,-h2,sz*.35,-h2);line(ctx,-sz*.35,h2,sz*.35,h2);});}
  else if(type==='coil'){withLW(ctx,th*.7,()=>{for(let i=0;i<4;i++)ctx.beginPath()||(ctx.arc(-sz*.25+i*sz*.16,0,sz*.12,-Math.PI,0))||ctx.stroke();});}
  else if(type==='node'){dot(ctx,0,0,th*1.3);}
  else{withLW(ctx,th*.6,()=>{ctx.beginPath();ctx.moveTo(-sz*.3,h2);ctx.lineTo(0,-h2);ctx.lineTo(sz*.3,h2);ctx.stroke();});}
  ctx.restore();
}
function celticKnot(ctx,x,y,w,h,vert){
  ctx.save();ctx.translate(x,y);
  if(!vert){
    ctx.beginPath();ctx.moveTo(0,h*.5);ctx.bezierCurveTo(w*.12,-h*.3,w*.38,h*1.3,w*.5,h*.5);ctx.bezierCurveTo(w*.62,-h*.3,w*.88,h*1.3,w,h*.5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,h*.5);ctx.bezierCurveTo(w*.12,h*1.3,w*.38,-h*.3,w*.5,h*.5);ctx.bezierCurveTo(w*.62,h*1.3,w*.88,-h*.3,w,h*.5);ctx.stroke();
  } else {
    ctx.beginPath();ctx.moveTo(w*.5,0);ctx.bezierCurveTo(-w*.3,h*.12,w*1.3,h*.38,w*.5,h*.5);ctx.bezierCurveTo(-w*.3,h*.62,w*1.3,h*.88,w*.5,h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(w*.5,0);ctx.bezierCurveTo(w*1.3,h*.12,-w*.3,h*.38,w*.5,h*.5);ctx.bezierCurveTo(w*1.3,h*.62,-w*.3,h*.88,w*.5,h);ctx.stroke();
  }
  ctx.restore();
}
function gothicArch(ctx,x,y,w,h,th){
  ctx.save();ctx.translate(x+w/2,y);const hw=w*.44;
  ctx.beginPath();ctx.moveTo(-hw,h);ctx.bezierCurveTo(-hw,h*.25,0,-h*.08,0,-h*.08);ctx.bezierCurveTo(0,-h*.08,hw,h*.25,hw,h);ctx.stroke();
  withLW(ctx,ctx.lineWidth*.6,()=>{ctx.beginPath();ctx.arc(-hw*.38,h*.48,hw*.34,-Math.PI,0);ctx.stroke();ctx.beginPath();ctx.arc(hw*.38,h*.48,hw*.34,-Math.PI,0);ctx.stroke();polygon(ctx,0,-h*.05,hw*.18,6);});
  ctx.restore();
}
function neoArch(ctx,x,y,w,h,th){
  ctx.save();ctx.translate(x+w/2,y);const hw=w*.44;
  ctx.beginPath();ctx.moveTo(-hw,h);ctx.bezierCurveTo(-hw,h*.2,-hw*.5,-h*.05,0,-h*.08);ctx.bezierCurveTo(hw*.5,-h*.05,hw,h*.2,hw,h);ctx.stroke();
  withLW(ctx,ctx.lineWidth*.55,()=>{

quantum(ctx, x, y, w, h, fc, th, det) {
  const cx = x + w / 2, cy = y + h / 2;
  const minS = Math.min(w, h);

  // 1. Triple-ring outer boundary (octagonal)
  const cuts = [minS * 0.04, minS * 0.025, minS * 0.01];
  const offs  = [0, th * 5, th * 9];
  cuts.forEach((c, i) => {
    const lw = i === 0 ? th * 3 : i === 1 ? th * 0.9 : th * 0.35;
    const oo = offs[i];
    withLW(ctx, lw, () => oct(ctx, x + oo, y + oo, w - oo * 2, h - oo * 2, c));
  });

  // 2. Lissajous interference network — 4 curves with different freq ratios
  const lissParams = [
    { a: 3, b: 2, delta: 0,            alpha: 0.55 },
    { a: 5, b: 4, delta: Math.PI / 4,  alpha: 0.35 },
    { a: 2, b: 3, delta: Math.PI / 6,  alpha: 0.30 },
    { a: 4, b: 3, delta: Math.PI / 3,  alpha: 0.20 },
  ];
  const rx = w * 0.44, ry = h * 0.44;
  withLW(ctx, th * 0.55, () => {
    lissParams.forEach(({ a, b, delta, alpha }) => {
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      const segs = det * 30 + 180;
      for (let i = 0; i <= segs; i++) {
        const t2 = (i / segs) * Math.PI * 2;
        const px = cx + rx * Math.sin(a * t2 + delta);
        const py = cy + ry * Math.sin(b * t2);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  });

  // 3. Nested orbital ellipses (tilted at different angles)
  const orbitCount = det + 4;
  withLW(ctx, th * 0.45, () => {
    ctx.globalAlpha = 0.42;
    for (let i = 0; i < orbitCount; i++) {
      const angle = (i / orbitCount) * Math.PI;
      const r1 = minS * (0.12 + i * 0.06);
      const r2 = r1 * 0.55;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.ellipse(0, 0, r1, r2, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  });

  // 4. Interference dot grid — standing-wave pattern
  const gridStep = minS / (det * 3 + 8);
  withLW(ctx, th * 0.3, () => {
    for (let gx = x; gx <= x + w; gx += gridStep) {
      for (let gy = y; gy <= y + h; gy += gridStep) {
        const dx = (gx - cx) / rx, dy = (gy - cy) / ry;
        const wave = Math.sin(dx * Math.PI * 3) * Math.cos(dy * Math.PI * 3);
        if (wave > 0.6) {
          const sz = th * (0.5 + wave * 0.8);
          ctx.globalAlpha = wave * 0.6;
          dot(ctx, gx, gy, sz);
        }
      }
    }
    ctx.globalAlpha = 1;
  });

  // 5. Radial starburst from centre
  const rayCount = det * 4 + 16;
  withLW(ctx, th * 0.4, () => {
    ctx.globalAlpha = 0.28;
    for (let i = 0; i < rayCount; i++) {
      const ang = (i / rayCount) * Math.PI * 2;
      const innerR = minS * 0.04;
      const outerR = minS * (i % 4 === 0 ? 0.40 : i % 2 === 0 ? 0.28 : 0.16);
      line(ctx,
        cx + Math.cos(ang) * innerR, cy + Math.sin(ang) * innerR,
        cx + Math.cos(ang) * outerR, cy + Math.sin(ang) * outerR
      );
    }
    ctx.globalAlpha = 1;
  });

  // 6. Corner quantum brackets (sharp L-brackets)
  const cs = minS * 0.10;
  withLW(ctx, th * 2.5, () => {
    [[x, y, 1, 1], [x + w, y, -1, 1], [x + w, y + h, -1, -1], [x, y + h, 1, -1]]
      .forEach(([bx2, by2, sx, sy]) => {
        ctx.save(); ctx.translate(bx2, by2); ctx.scale(sx, sy);
        ctx.beginPath();
        ctx.moveTo(0, cs); ctx.lineTo(0, 0); ctx.lineTo(cs, 0);
        ctx.stroke();
        withLW(ctx, th * 0.8, () => {
          ctx.beginPath();
          ctx.moveTo(cs * 0.4, 0); ctx.lineTo(cs * 0.4, cs * 0.4); ctx.lineTo(0, cs * 0.4);
          ctx.stroke();
        });
        dot(ctx, cs * 0.15, cs * 0.15, th * 1.2);
        ctx.restore();
      });
  });

  // 7. Mid-edge tick marks with quantum nodes
  const tickPts = [
    [cx, y, 0], [cx, y + h, Math.PI], [x, cy, Math.PI / 2], [x + w, cy, -Math.PI / 2]
  ];
  withLW(ctx, th, () => {
    tickPts.forEach(([px, py, rot]) => {
      ctx.save(); ctx.translate(px, py); ctx.rotate(rot);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -th * 4.5); ctx.stroke();
      withLW(ctx, th * 0.5, () => {
        ctx.beginPath(); ctx.moveTo(-th * 2, -th * 2.5); ctx.lineTo(th * 2, -th * 2.5); ctx.stroke();
      });
      dot(ctx, 0, 0, th * 1.3);
      ctx.restore();
    });
  });

  // 8. Central quantum sigil
  withLW(ctx, th * 1.2, () => {
    circle(ctx, cx, cy, minS * 0.035);
    circle(ctx, cx, cy, minS * 0.018);
  });
  withLW(ctx, th * 0.5, () => {
    for (let i = 0; i < 8; i++) {
      const ang = i * Math.PI / 4;
      line(ctx,
        cx + Math.cos(ang) * minS * 0.038,
        cy + Math.sin(ang) * minS * 0.038,
        cx + Math.cos(ang) * minS * 0.065,
        cy + Math.sin(ang) * minS * 0.065
      );
    }
  });
  dot(ctx, cx, cy, th * 1.5);
},

      for(let i=0;i<8;i++){ctx.save();ctx.rotate(i*τ/8);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(r*.3,r*.1,r*.5,r*.4,r*.7,r*.3);ctx.bezierCurveTo(r*.9,r*.2,r*.8,-r*.1,r,0);ctx.stroke();ctx.restore();}
      circle(ctx,0,0,r*.25);
    });dot(ctx,0,0,th);ctx.restore();
  });
}
};

window.addEventListener('resize', draw);
draw();
</script>
